version: '3.8'

services:
  frontend-staging:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:5000
    ports:
      - "5173:5173"
    environment:
      NODE_ENV: staging
    networks:
      - staging-network
    depends_on:
      - backend-staging
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:5173 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  backend-staging:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:3000"
    environment:
      NODE_ENV: staging
      DATABASE_URL: mysql://staging_user:staging_pass@db-staging:3306/vintagedago_staging
      MYSQL_HOST: db-staging
      MYSQL_USER: staging_user
      MYSQL_PASSWORD: staging_pass
      MYSQL_DATABASE: vintagedago_staging
      JWT_SECRET: test-secret-key-staging-do-not-use-production
      CORS_ORIGIN: http://localhost:5173
      API_PORT: 3000
      LOG_LEVEL: debug
    depends_on:
      db-staging:
        condition: service_healthy
    networks:
      - staging-network
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  db-staging:
    image: mysql:8.0
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: vintagedago_staging
      MYSQL_USER: staging_user
      MYSQL_PASSWORD: staging_pass
    volumes:
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seeds.sql:/docker-entrypoint-initdb.d/02-seeds.sql:ro
      - staging-db-volume:/var/lib/mysql
    networks:
      - staging-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "staging_user", "-pstaging_pass"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

volumes:
  staging-db-volume:

networks:
  staging-network:
    driver: bridge
